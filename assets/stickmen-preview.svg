<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Stickman Arena : accueil, choix et combat</title><desc id="desc">Aperçu original du menu, du choix de partie et d'un combat cartoon entre deux personnages colorés.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#11182b"/><stop offset="1" stop-color="#303952"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#56627d"/><stop offset="1" stop-color="#282f43"/></linearGradient></defs>
<rect width="1200" height="680" rx="26" fill="url(#bg)"/><path d="M0 430h1200v250H0z" fill="url(#floor)"/><path d="M0 430h1200M100 430v250m180-250v250m180-250v250m180-250v250m180-250v250m180-250v250" stroke="#a8b2ca" stroke-opacity=".2" stroke-width="3"/>
<text x="600" y="65" text-anchor="middle" fill="#ffcf48" font-family="Arial,sans-serif" font-size="38" font-weight="bold" letter-spacing="5">STICKMAN ARENA</text><text x="600" y="105" text-anchor="middle" fill="#cbd5e8" font-family="Arial,sans-serif" font-size="17">Choisis ta partie, personnalise tes héros, puis combats !</text>
