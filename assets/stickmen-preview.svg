<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu Stickman Arena — combattants cartoon</title>
  <desc id="desc">Deux personnages de jeu cartoon aux formes rondes, l'un bleu et l'autre rouge, se font face dans une arène.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#11182b"/><stop offset="1" stop-color="#303952"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#56627d"/><stop offset="1" stop-color="#282f43"/></linearGradient>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#sky)"/>
  <path d="M0 400h1200v220H0z" fill="url(#floor)"/>
  <path d="M0 400h1200M90 400v220m170-220v220m170-220v220m170-220v220m170-220v220m170-220v220m170-220v220" stroke="#a8b2ca" stroke-opacity=".2" stroke-width="3"/>
  <text x="600" y="72" text-anchor="middle" fill="#ffda5b" font-family="Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="5">STICKMAN ARENA</text>
  <text x="600" y="112" text-anchor="middle" fill="#b7c1d6" font-family="Arial,sans-serif" font-size="17">Personnages cartoon colorés • jeu Ursina</text>
  <g stroke="#20202d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Combattant bleu, silhouette ronde et compacte -->
    <g stroke-width="28">
      <path d="M390 310L350 365L335 430M425 310L455 365L490 420" fill="none" stroke="#20202d" stroke-width="34"/>
      <path d="M350 365L335 430M455 365L490 420" fill="none" stroke="#2b99e8"/>
      <path d="M350 232L300 280L270 315M424 232L480 250L525 238" fill="none" stroke="#20202d" stroke-width="34"/>
      <path d="M350 232L300 280L270 315M424 232L480 250L525 238" fill="none" stroke="#2b99e8"/>
    </g>
    <ellipse cx="390" cy="285" rx="62" ry="83" fill="#20202d"/><ellipse cx="390" cy="285" rx="52" ry="73" fill="#2b99e8"/>
    <circle cx="390" cy="190" r="68" fill="#20202d"/><circle cx="390" cy="190" r="59" fill="#2b99e8"/>
    <ellipse cx="370" cy="188" rx="8" ry="11" fill="white"/><ellipse cx="410" cy="188" rx="8" ry="11" fill="white"/>
    <circle cx="373" cy="189" r="4" fill="#20202d"/><circle cx="413" cy="189" r="4" fill="#20202d"/><path d="M380 215q10 9 20 0" fill="none" stroke="#20202d" stroke-width="5"/>
    <ellipse cx="335" cy="440" rx="30" ry="13" fill="#20202d"/><ellipse cx="490" cy="430" rx="30" ry="13" fill="#20202d"/>
    <!-- Combattant rouge -->
    <g transform="translate(1200 0) scale(-1 1)">
      <g stroke-width="28">
        <path d="M390 310L350 365L335 430M425 310L455 365L490 420" fill="none" stroke="#20202d" stroke-width="34"/>
        <path d="M350 365L335 430M455 365L490 420" fill="none" stroke="#e54861"/>
        <path d="M350 232L300 280L270 315M424 232L480 250L525 238" fill="none" stroke="#20202d" stroke-width="34"/>
        <path d="M350 232L300 280L270 315M424 232L480 250L525 238" fill="none" stroke="#e54861"/>
      </g>
      <ellipse cx="390" cy="285" rx="62" ry="83" fill="#20202d"/><ellipse cx="390" cy="285" rx="52" ry="73" fill="#e54861"/>
      <circle cx="390" cy="190" r="68" fill="#20202d"/><circle cx="390" cy="190" r="59" fill="#e54861"/>
      <ellipse cx="370" cy="188" rx="8" ry="11" fill="white"/><ellipse cx="410" cy="188" rx="8" ry="11" fill="white"/>
      <circle cx="373" cy="189" r="4" fill="#20202d"/><circle cx="413" cy="189" r="4" fill="#20202d"/><path d="M380 215q10 9 20 0" fill="none" stroke="#20202d" stroke-width="5"/>
      <ellipse cx="335" cy="440" rx="30" ry="13" fill="#20202d"/><ellipse cx="490" cy="430" rx="30" ry="13" fill="#20202d"/>
    </g>
  </g>
  <text x="390" y="500" text-anchor="middle" fill="#75cdff" font-family="Arial,sans-serif" font-weight="700" font-size="18">JOUEUR</text>
  <text x="810" y="500" text-anchor="middle" fill="#ff8190" font-family="Arial,sans-serif" font-weight="700" font-size="18">ADVERSAIRE</text>
  <g transform="translate(215 535)"><rect width="330" height="18" rx="9" fill="#364156"/><rect width="292" height="18" rx="9" fill="#47df88"/><rect x="655" width="330" height="18" rx="9" fill="#364156"/><rect x="655" width="250" height="18" rx="9" fill="#ff5368"/></g>
  <text x="600" y="590" text-anchor="middle" fill="#d2d9e8" font-family="Arial,sans-serif" font-size="16">A / D : bouger   •   ESPACE : sauter   •   J : frapper   •   K : bloquer</text>
</svg>
